<style>
/* ==================================================
   一、整體樣式
================================================== */

:root {
    --bg: #fff8ec;
    --dark: #594a3c;
    --accent: #d98b5f;
    --green: #789b78;
    --light: #f4e5d2;
    --white: #ffffff;
    --muted: #8b7765;
    --border: #eadbc9;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: var(--bg);
    color: var(--dark);
    font-family:
        "Microsoft JhengHei",
        "Noto Sans TC",
        Arial,
        sans-serif;
}

button, input {
    font: inherit;
}

button {
    cursor: pointer;
}

.container {
    width: min(100% - 28px, 1050px);
    margin: 0 auto;
    padding-bottom: 35px;
}

/* ==================================================
   二、標題
================================================== */

header {
    text-align: center;
    padding: 30px 10px 20px;
}

header h1 {
    margin: 0;
    font-size: clamp(34px, 6vw, 52px);
    color: var(--dark);
    letter-spacing: 5px;
}

header p {
    color: var(--muted);
    font-size: 15px;
    margin-top: 8px;
}

/* ==================================================
   三、區塊卡片
================================================== */

.section {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 15px;
    box-shadow: 0 3px 12px rgba(90, 65, 40, 0.04);
}

.section h2 {
    font-size: 19px;
    margin: 0 0 14px;
    color: var(--dark);
}

.section-description {
    font-size: 13px;
    color: var(--muted);
    margin: -5px 0 13px;
    line-height: 1.7;
}

/* ==================================================
   四、選項與按鈕
================================================== */

.radio-list {
    display: flex;
    flex-wrap: wrap;
    gap: 12px 24px;
    margin-bottom: 15px;
}

.radio-list label,
.check-grid label {
    display: flex;
    align-items: center;
    gap: 7px;
    cursor: pointer;
    font-size: 14px;
}

input[type="checkbox"],
input[type="radio"] {
    accent-color: var(--accent);
    width: 17px;
    height: 17px;
    cursor: pointer;
}

.city-select {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
    margin: 10px 0;
}

.city-select button {
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 9px 20px;
    background: var(--white);
    color: var(--dark);
}

.city-select button.active {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
}

.city-select button:disabled {
    opacity: .45;
    cursor: not-allowed;
}

.check-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 12px 8px;
}

.check-grid label {
    min-width: 0;
}

.button-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 15px;
}

.btn {
    border: none;
    border-radius: 9px;
    padding: 10px 17px;
    font-size: 14px;
    transition: .2s;
}

.btn:hover {
    filter: brightness(.95);
    transform: translateY(-1px);
}

.btn-light {
    background: var(--light);
    color: var(--dark);
}

.btn-orange {
    background: var(--accent);
    color: white;
}

.btn-green {
    background: var(--green);
    color: white;
}

.btn-red {
    background: #e8b7a1;
    color: var(--dark);
}

.btn:disabled {
    opacity: .5;
    cursor: not-allowed;
    transform: none;
}

/* ==================================================
   五、預算
================================================== */

.budget-area {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
}

.budget-area input {
    width: 150px;
    max-width: 100%;
    padding: 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    outline-color: var(--accent);
}

/* ==================================================
   六、推薦結果
================================================== */

.result {
    text-align: center;
    background: #fffaf4;
    border: 2px dashed #e6c5a8;
    border-radius: 14px;
    padding: 25px 15px;
    margin-top: 8px;
}

.result-location {
    color: var(--green);
    font-size: 15px;
    font-weight: bold;
    overflow-wrap: anywhere;
}

.result-name {
    color: var(--accent);
    font-size: clamp(30px, 6vw, 42px);
    font-weight: bold;
    margin: 18px 0;
    overflow-wrap: anywhere;
}

.result-info {
    margin: 9px 0;
    line-height: 1.7;
}

.result-price {
    color: #b45e3d;
    font-size: 18px;
    font-weight: bold;
}

.result-description {
    color: var(--muted);
    font-size: 14px;
}

.main-button {
    display: block;
    width: 100%;
    padding: 16px;
    font-size: 19px;
    font-weight: bold;
    margin-top: 15px;
}

/* ==================================================
   七、收藏清單
================================================== */

.favorite-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.favorite-item {
    border: 1px solid var(--border);
    background: #fffaf4;
    border-radius: 10px;
    padding: 13px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
}

.favorite-details {
    min-width: 0;
    line-height: 1.7;
    overflow-wrap: anywhere;
}

.favorite-name {
    font-weight: bold;
    color: var(--dark);
}

.favorite-meta {
    font-size: 13px;
    color: var(--muted);
}

.favorite-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    flex-shrink: 0;
}

.favorite-actions button {
    padding: 7px 10px;
    font-size: 12px;
}

.empty-message {
    text-align: center;
    padding: 20px;
    color: var(--muted);
    font-size: 14px;
}

footer {
    text-align: center;
    color: #9b8978;
    font-size: 12px;
    line-height: 1.8;
    padding: 15px;
}

/* ==================================================
   八、手機版
================================================== */

@media (max-width: 650px) {

    .container {
        width: min(100% - 18px, 1050px);
    }

    header {
        padding-top: 22px;
    }

    .section {
        padding: 15px;
        border-radius: 12px;
    }

    .check-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));

    }

    .check-grid label {
        font-size: 12px;
    }

    .favorite-item {
        flex-direction: column;
        align-items: stretch;
    }

    .favorite-actions {
        width: 100%;
    }

    .favorite-actions button {
        flex: 1;
    }

    .budget-area input {
        width: 100%;
    }

    .btn {
        padding: 9px 12px;
    }
}

@media (max-width: 380px) {
    .check-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
    }
}
