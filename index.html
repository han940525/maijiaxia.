function getCityMode() {
    return document.querySelector(
        'input[name="cityMode"]:checked'
    ).value;
}

function getSelectedCity() {
    return document.querySelector(
        'input[name="city"]:checked'
    ).value;
}

document.querySelectorAll('input[name="cityMode"]').forEach(
    radio => {
        radio.addEventListener("change", updateCityMode);
    }
);

document.querySelectorAll('input[name="city"]').forEach(
    radio => {
        radio.addEventListener("change", buildDistrictCheckboxes);
    }
);

function updateCityMode() {

    const mode = getCityMode();

    const citySelect = document.getElementById("citySelect");
    const districtDescription = document.getElementById(
        "districtDescription"
    );

    if (mode === "manual") {

        citySelect.style.opacity = "1";
        citySelect.style.pointerEvents = "auto";

        districtDescription.textContent =
            "可複選行政區；不選或全選時，顯示為（全行政區）。";

        buildDistrictCheckboxes();

    } else {

        citySelect.style.opacity = "0.4";
        citySelect.style.pointerEvents = "none";

        districtDescription.textContent =
            "隨機城市模式：程式會隨機抽城市，並隨機抽出該城市的一個行政區。";
    }
}


// ============================================================

function buildDistrictCheckboxes() {

    const city = getSelectedCity();

    const grid = document.getElementById("districtGrid");

    grid.innerHTML = "";

    CITY_DISTRICTS[city].forEach(district => {

        const label = document.createElement("label");

        label.innerHTML = `
            <input type="checkbox" value="${district}">
            ${district}
        `;

        grid.appendChild(label);
    });
}

function selectAllDistricts() {

    document.querySelectorAll(
        "#districtGrid input"
    ).forEach(cb => cb.checked = true);
}

function clearDistricts() {

    document.querySelectorAll(
        "#districtGrid input"
    ).forEach(cb => cb.checked = false);
}

// ============================================================

function buildCategoryCheckboxes() {

    const grid = document.getElementById("categoryGrid");

    grid.innerHTML = "";

    Object.keys(FOOD_DATA).forEach(category => {

        const label = document.createElement("label");

        label.innerHTML = `
            <input type="checkbox" value="${category}" checked>
            ${category}
        `;

        grid.appendChild(label);
    });
}

function selectAllCategories() {

    document.querySelectorAll(
        "#categoryGrid input"
    ).forEach(cb => cb.checked = true);
}

function clearCategories() {

    document.querySelectorAll(
        "#categoryGrid input"
    ).forEach(cb => cb.checked = false);
}


// ============================================================
// 八、選擇推薦地區
// ============================================================

function chooseLocation() {

    // 隨機城市
    if (getCityMode() === "random") {

        const cities = Object.keys(CITY_DISTRICTS);

        const city = cities[
            Math.floor(Math.random() * cities.length)
        ];

        const district = CITY_DISTRICTS[city][
            Math.floor(Math.random() * CITY_DISTRICTS[city].length)
        ];

        return city + district;
    }

    const city = getSelectedCity();

    const allDistricts = CITY_DISTRICTS[city];

    // 自選城市＋隨機行政區
    if (document.getElementById("randomDistrict").checked) {

        const district = allDistricts[
            Math.floor(Math.random() * allDistricts.length)
        ];

        return city + district;
    }

    // 手動選擇行政區
    const selectedDistricts = Array.from(
        document.querySelectorAll("#districtGrid input:checked")
    ).map(cb => cb.value);

    // 沒選行政區
    if (selectedDistricts.length === 0) {
        return city + "(全行政區)";
    }

    // 全選
    if (selectedDistricts.length === allDistricts.length) {
        return city + "(全行政區)";
    }

    // 部分選擇
    return city + selectedDistricts.join("、");
}


// ============================================================
// 九、篩選餐點
// ============================================================

function getFilteredFoods() {

    const selectedCategories = Array.from(
        document.querySelectorAll("#categoryGrid input:checked")
    ).map(cb => cb.value);

    if (selectedCategories.length === 0) {

        alert("請至少選擇一種餐點類型！");

        return null;
    }

    const budgetText = document.getElementById("budget").value.trim();

    let budget = null;

    if (budgetText !== "") {

        budget = Number(budgetText);

        if (!Number.isInteger(budget) || budget < 0) {

            alert("預算請輸入大於或等於 0 的整數！");

            return null;
        }
    }

    const filtered = ALL_FOODS.filter(food => {

        if (!selectedCategories.includes(food.category)) {
            return false;
        }

        if (budget !== null && food.price_max > budget) {
            return false;
        }

        return true;
    });

    if (filtered.length === 0) {

        alert(
            "目前條件沒有符合的餐點。\n請提高預算或增加餐點類型。"
        );

        return null;
    }

    return filtered;
}


// ============================================================
// 十、隨機推薦
// ============================================================

function recommendFood() {

    const location = chooseLocation();

    const filtered = getFilteredFoods();

    if (filtered === null) {
        return;
    }

    // 避免重複推薦
    let remaining = filtered.filter(food => {

        const key = food.category + "|" + food.name;

        return !drawnFoods.has(key);
    });

    // 全部抽完重新開始
    if (remaining.length === 0) {

        drawnFoods.clear();

        remaining = filtered.slice();

        alert(
            "符合條件的餐點已全部推薦過，將重新開始抽選！"
        );
    }

    const selected = remaining[
        Math.floor(Math.random() * remaining.length)
    ];

    drawnFoods.add(
        selected.category + "|" + selected.name
    );

    currentFood = selected;
    currentLocation = location;

    document.getElementById("resultLocation").textContent =
        "推薦地區：" + location;

    document.getElementById("resultName").textContent =
        selected.name;

    document.getElementById("resultCategory").textContent =
        "餐點類型：" + selected.category;

    document.getElementById("resultPrice").textContent =
        "參考價格：$" + selected.price_min +
        "～$" + selected.price_max;

    document.getElementById("resultDescription").textContent =
        selected.description;
}


// ============================================================
// 十一、Google 地圖搜尋
// ============================================================

function searchGoogleMaps() {

    if (currentFood === null) {

        alert("請先按下隨機推薦！");

        return;
    }

    const query =
        currentLocation + " " + currentFood.name + " 美食";

    const url =
        "https://www.google.com/maps/search/?api=1&query=" +
        encodeURIComponent(query);

    window.open(url, "_blank");
}


// ============================================================
// 十二、收藏功能
// ============================================================

function addFavorite() {

    if (currentFood === null) {

        alert("請先推薦餐點後再收藏！");

        return;
    }

    const favorite = {

        category: currentFood.category,
        name: currentFood.name,
        price_min: currentFood.price_min,
        price_max: currentFood.price_max,
        description: currentFood.description,
        location: currentLocation
    };

    // 避免重複收藏
    const exists = favorites.some(item => {

        return item.name === favorite.name &&
               item.location === favorite.location;
    });

    if (exists) {

        alert("這個餐點與地區已經在收藏清單中！");

        return;
    }

    favorites.push(favorite);

    saveFavorites();

    refreshFavorites();

    alert("已收藏：" + favorite.name);
}


// ============================================================
// 十三、顯示收藏清單
// ============================================================

function refreshFavorites() {

    const list = document.getElementById("favoriteList");

    list.innerHTML = "";

    if (favorites.length === 0) {

        list.innerHTML =
            '<p class="description">目前尚無收藏餐點。</p>';

        return;
    }

    favorites.forEach((item, index) => {

        const div = document.createElement("div");

        div.className = "favorite-item";

        div.innerHTML = `
            <div class="favorite-info">
                <label>
                    <input type="checkbox" class="favorite-check" value="${index}">
                    <strong>${escapeHTML(item.name)}</strong>
                </label>
                <div class="description">
                    ${escapeHTML(item.location || "未指定地區")}
                    ｜${escapeHTML(item.category || "未分類")}
                    ｜$${item.price_min}～$${item.price_max}
                </div>
            </div>

            <div class="favorite-actions">
                <button class="btn-light"
                    onclick="searchFavorite(${index})">
                    搜尋店家
                </button>
            </div>
        `;

        list.appendChild(div);
    });
}


// 避免顯示文字被當成HTML
function escapeHTML(text) {

    return String(text).replace(/[&<>"']/g, function(char) {

        const map = {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
        };

        return map[char];
    });
}


// ============================================================
// 十四、刪除收藏
// ============================================================

function deleteFavorite() {

    const selected = Array.from(
        document.querySelectorAll(".favorite-check:checked")
    ).map(cb => Number(cb.value));

    if (selected.length === 0) {

        alert("請先選擇要刪除的收藏！");

        return;
    }

    // 由後往前刪除，避免索引位移
    selected.sort((a, b) => b - a);

    selected.forEach(index => {
        favorites.splice(index, 1);
    });

    saveFavorites();

    refreshFavorites();
}


// ============================================================
// 十五、搜尋收藏
// ============================================================

function searchFavorite(index) {

    const item = favorites[index];

    const query =
        item.location + " " + item.name + " 美食";

    const url =
        "https://www.google.com/maps/search/?api=1&query=" +
        encodeURIComponent(query);

    window.open(url, "_blank");
}


// ============================================================
// 十六、重置抽選紀錄
// ============================================================

function resetDrawHistory() {

    drawnFoods.clear();

    alert("已清除抽選紀錄，可以重新抽選所有餐點！");
}


// ============================================================
// 十七、初始化
// ============================================================

buildDistrictCheckboxes();

buildCategoryCheckboxes();

refreshFavorites();

updateCityMode();

</script>
